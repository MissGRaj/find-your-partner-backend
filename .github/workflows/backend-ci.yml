name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu

    services:
      postgres:
        image: postgres:18.6

        env:
          POSTGRES_DB: matrimony_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234

        ports:
          - 5432:5432

        options: >-
          --health-cmd pq_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: ./mvnw clean verify
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_USERNAME: postgres
          DB_PASSWORD: 1234




